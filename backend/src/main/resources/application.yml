spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ecommerce-backend

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

storage:
  provider: ${STORAGE_PROVIDER:local}
  base-path: ${STORAGE_BASE_PATH:./storage}

payment:
  provider: ${PAYMENT_PROVIDER:mock}
  api-key: ${PAYMENT_API_KEY:}
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

midtrans:
  server-key: ${MIDTRANS_SERVER_KEY:}
  client-key: ${MIDTRANS_CLIENT_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# konfigurasi google OAuth
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  recaptcha:
    site-key: ${RECAPTCHA_SITE_KEY:}
    secret: ${RECAPTCHA_SECRET:${RECAPTCHA_SECRET_KEY:}}
    enabled: ${RECAPTCHA_ENABLED:false}

# konfigurasi google recaptcha
recaptcha:
  secret: ${RECAPTCHA_SECRET:}
  enabled: ${RECAPTCHA_ENABLED:false}
