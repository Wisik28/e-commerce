spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ecommerce-backend

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

storage:
  provider: ${STORAGE_PROVIDER:local}
  base-path: ${STORAGE_BASE_PATH:./storage}

payment:
  provider: ${PAYMENT_PROVIDER:mock}
  api-key: ${PAYMENT_API_KEY:}
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

google:
  recaptcha:
    site-key: ${RECAPTCHA_SITE_KEY:6LeIxAcTAAAAABp30egCoDu2i1fg_88Gg5_q9mCH}
    secret: ${RECAPTCHA_SECRET:${RECAPTCHA_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TnFTxWGRtBpa3Wgahody}}
    enabled: ${RECAPTCHA_ENABLED:true}



